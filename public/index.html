<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notas</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Bloc de notas</p>
      <h1>Notas</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>

    <section id="app-view" class="app hidden">
      <aside class="side">
        <div class="brand">
          <p class="eyebrow">Vanilla JS · Mongo</p>
          <h1>Notas</h1>
          <p id="user-name"></p>
        </div>
        <button id="new-note" class="primary" type="button">Nueva nota</button>
        <input id="search" type="search" placeholder="Buscar titulo o texto" />
        <nav id="categories" class="categories"></nav>
        <button id="logout" class="ghost" type="button">Salir</button>
      </aside>
      <section class="list-pane">
        <ul id="notes"></ul>
      </section>
      <section class="editor card">
        <form id="note-form">
          <input id="title" name="title" placeholder="Titulo" maxlength="120" required />
          <input id="category" name="category" placeholder="Categoria" maxlength="32" />
          <textarea id="body" name="body" placeholder="Escribi la nota" rows="16"></textarea>
          <label class="checkline"><input id="pinned" name="pinned" type="checkbox" /> Fijar</label>
          <p id="note-error" class="error" hidden></p>
          <div class="row">
            <button class="primary" type="submit">Guardar</button>
            <button id="delete-note" class="danger" type="button" hidden>Borrar</button>
          </div>
        </form>
      </section>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
